provider:
  type: openai_compatible
  base_url_env: NIM_BASE_URL
  api_key_env: NIM_API_KEY

roles:
  planner:
    primary: nvidia/nemotron-3-super-120b-a12b
    deep: nvidia/nemotron-3-ultra-550b-a55b
    canary: google/gemma-4-31b-it
    reasoning: true
  workhorse:
    primary: nvidia/nemotron-3.5-lightning-30b-a3b
    fallback: nvidia/nemotron-3-super-120b-a12b
    reasoning: true
  extractor:
    primary: nvidia/nemotron-3.5-lightning-30b-a3b
    fallback: google/gemma-4-31b-it
    deep: nvidia/nemotron-3-super-120b-a12b
    reasoning: false
    json_mode: true
  verifier:
    primary: nvidia/nemotron-3-ultra-550b-a55b
    fallback: nvidia/nemotron-3-super-120b-a12b
    norwegian_fallback: google/gemma-4-31b-it
    reasoning: true
  reporter:
    primary: nvidia/nemotron-3-super-120b-a12b
    deep: nvidia/nemotron-3-ultra-550b-a55b
    norwegian_fallback: google/gemma-4-31b-it
    reasoning: true
  vision:
    primary: google/gemma-4-31b-it
    fallback: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    note: Gemma 4 is primary for Norwegian/multilingual image and document understanding; Nano Omni is English-only per model card.
  embedding:
    primary: nvidia/nemotron-3-embed-1b

routing:
  escalate_to_deep_on:
    - material_contradiction
    - unresolved_identity
    - complex_network
    - verifier_disagreement
    - long_multi_document_synthesis
  norwegian_eval_required: true
  benchmark_dimensions:
    - norwegian_quality
    - structured_output_validity
    - tool_call_validity
    - vision_ocr_quality
    - latency_first_token
    - latency_total
    - tokens_per_second
