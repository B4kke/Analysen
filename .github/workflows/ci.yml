name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: analysen
          POSTGRES_USER: analysen
          POSTGRES_PASSWORD: analysen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analysen -d analysen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://analysen:analysen@localhost:5432/analysen
          TEST_REDIS_URL: redis://localhost:6379/0
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://analysen:analysen@localhost:5432/analysen
      - run: ruff check .
      - run: mypy apps
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://analysen:analysen@localhost:5432/analysen
          TEST_REDIS_URL: redis://localhost:6379/0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  ui-smoke:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start isolated local stack
        run: docker compose up --build -d postgres redis migrate api worker web
      - name: Wait for API and web
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null               && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Install web test dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run 390px investigation smoke
        working-directory: apps/web
        env:
          TEST_WEB_URL: http://127.0.0.1:3000
          TEST_API_URL: http://127.0.0.1:8000
        run: npm run test:smoke
      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 api worker web migrate
      - name: Stop isolated local stack
        if: always()
        run: docker compose down -v --remove-orphans
