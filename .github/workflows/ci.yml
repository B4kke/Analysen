name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: analysen
          POSTGRES_USER: analysen
          POSTGRES_PASSWORD: analysen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analysen -d analysen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://analysen:analysen@localhost:5432/analysen
          TEST_REDIS_URL: redis://localhost:6379/0
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://analysen:analysen@localhost:5432/analysen
      - run: ruff check .
      - run: mypy apps
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://analysen:analysen@localhost:5432/analysen
          TEST_REDIS_URL: redis://localhost:6379/0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  ui-smoke:
    runs-on: ubuntu-latest
    needs: [python, web]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: analysen
          POSTGRES_USER: analysen
          POSTGRES_PASSWORD: analysen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analysen -d analysen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://analysen:analysen@127.0.0.1:5432/analysen
      REDIS_URL: redis://127.0.0.1:6379/0
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API test runtime
        run: pip install -r requirements-dev.lock
      - name: Migrate smoke database
        run: alembic upgrade head
      - name: Install and build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start API, worker and web
        shell: bash
        run: |
          nohup uvicorn apps.api.app.main:app --host 127.0.0.1 --port 8000 > /tmp/analysen-api.log 2>&1 &
          echo $! > /tmp/analysen-api.pid
          nohup dramatiq apps.worker.app.tasks -p 1 -t 2 > /tmp/analysen-worker.log 2>&1 &
          echo $! > /tmp/analysen-worker.pid
          (
            cd apps/web
            nohup npm run start -- -H 127.0.0.1 > /tmp/analysen-web.log 2>&1 &
            echo $! > /tmp/analysen-web.pid
          )
      - name: Wait for API and web
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/analysen-api.log || true
          cat /tmp/analysen-worker.log || true
          cat /tmp/analysen-web.log || true
          exit 1
      - name: Run 390px investigation smoke
        working-directory: apps/web
        env:
          TEST_WEB_URL: http://127.0.0.1:3000
          TEST_API_URL: http://127.0.0.1:8000
        run: npm run test:smoke
      - name: Show runtime logs on failure
        if: failure()
        run: |
          cat /tmp/analysen-api.log || true
          cat /tmp/analysen-worker.log || true
          cat /tmp/analysen-web.log || true
      - name: Stop smoke processes
        if: always()
        shell: bash
        run: |
          for pidfile in /tmp/analysen-api.pid /tmp/analysen-worker.pid /tmp/analysen-web.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done
