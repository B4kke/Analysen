services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: analysen
      POSTGRES_USER: analysen
      POSTGRES_PASSWORD: analysen
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  searxng:
    image: searxng/searxng:latest
    ports: ["8080:8080"]
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://analysen:analysen@postgres:5432/analysen
      REDIS_URL: redis://redis:6379/0
      SEARXNG_BASE_URL: http://searxng:8080
    ports: ["8000:8000"]
    depends_on: [postgres, redis, searxng]
    volumes:
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["dramatiq", "apps.worker.app.tasks"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://analysen:analysen@postgres:5432/analysen
      REDIS_URL: redis://redis:6379/0
      SEARXNG_BASE_URL: http://searxng:8080
    depends_on: [postgres, redis, searxng]
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
